<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4945FF" />
      <stop offset="100%" stop-color="#271FE0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E5FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Central Recycle Bin & Restore Icon Graphic -->
  <g filter="url(#shadow)" fill="url(#iconGrad)">
    <!-- Bin Lid / Handle -->
    <rect x="216" y="112" width="80" height="20" rx="10" />
    <path d="M152 144 H360 C368.8 144 376 151.2 376 160 C376 168.8 368.8 176 360 176 H152 C143.2 176 136 168.8 136 160 C136 151.2 143.2 144 152 144 Z" />

    <!-- Bin Container Body -->
    <path d="M168 196 H344 L328 376 C326.4 394 311.2 408 293 408 H219 C200.8 408 185.6 394 184 376 L168 196 Z" opacity="0.95" />

    <!-- Vertical Grooves on Bin Body -->
    <rect x="216" y="228" width="16" height="136" rx="8" fill="#4945FF" opacity="0.65" />
    <rect x="248" y="228" width="16" height="136" rx="8" fill="#4945FF" opacity="0.65" />
    <rect x="280" y="228" width="16" height="136" rx="8" fill="#4945FF" opacity="0.65" />
  </g>

  <!-- Green Dynamic Restore / Recycle Arrow Badge -->
  <g transform="translate(320, 290)">
    <circle cx="56" cy="56" r="56" fill="#10B981" filter="url(#shadow)" />
    <!-- Circular refresh / restore arrow in white -->
    <path d="M56 28 C71.4 28 84 40.6 84 56 C84 63.8 80.8 70.8 75.6 75.8 L68.2 68.4 C71.8 64.8 74 60.6 74 56 C74 46.1 66 38 56 38 C49.2 38 43.2 41.8 40.2 47.4 L47 54.2 H26 V33.2 L32.8 40 C37.4 32.8 46.2 28 56 28 Z" fill="#FFFFFF" />
  </g>
</svg>
